<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medieval Stick War</title><style>body{margin:0;background:#11152a;color:white;font:18px system-ui;min-height:100vh;display:grid;place-items:center}#status{padding:20px;text-align:center}</style></head><body><p id="status">Loading Medieval Stick War…</p><script>window.__universetalParts=[];</script>
<script src="medieval-stick-war-part-1.js"></script>
<script src="medieval-stick-war-part-2.js"></script>
<script src="medieval-stick-war-part-3.js"></script>
<script src="medieval-stick-war-part-4.js"></script>
<script src="medieval-stick-war-part-5.js"></script>
<script src="medieval-stick-war-part-6.js"></script>
<script>(function(){try{const p=window.__universetalParts;const expected=6;if(p.length!==expected||Array.from({length:expected},(_,i)=>typeof p[i]==='string'&&p[i].length>0).some(x=>!x))throw Error('Missing game data. Upload all 6 data files beside medieval-stick-war.html.');const bytes=new Uint8Array(33273997);let offset=0;for(const part of p){const raw=atob(part);if(offset+raw.length>bytes.length)throw Error('Invalid game data length');for(let i=0;i<raw.length;i++)bytes[offset+i]=raw.charCodeAt(i);offset+=raw.length;}if(offset!==bytes.length)throw Error('Incomplete game data.');const html=new TextDecoder('utf-8',{fatal:true,ignoreBOM:true}).decode(bytes);delete window.__universetalParts;setTimeout(()=>{document.open();document.write(html);document.close();},0);}catch(e){document.getElementById('status').textContent='Could not load game: '+e.message;}})();</script></body></html>
