<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medieval Stick War</title><style>body{background:#11152a;color:white;font:18px system-ui;display:grid;place-items:center;height:100vh;margin:0}</style><p id="status">Loading Medieval Stick War…</p><script>window.__gameParts=[];</script><script src="medieval-stick-war-part-1.js"></script><script src="medieval-stick-war-part-2.js"></script><script>window.addEventListener('load',()=>setTimeout(()=>{try{const p=window.__gameParts;if(p.length!==2||!p[0]||!p[1])throw Error('Both game data files must be uploaded beside this HTML file.');const a=atob(p[0]),b=atob(p[1]),bytes=new Uint8Array(a.length+b.length);for(let i=0;i<a.length;i++)bytes[i]=a.charCodeAt(i);for(let i=0;i<b.length;i++)bytes[a.length+i]=b.charCodeAt(i);const html=new TextDecoder('utf-8',{fatal:true}).decode(bytes);document.open();document.write(html);document.close();}catch(e){document.getElementById('status').textContent='Unable to load game: '+e.message;}},0));</script></html>
